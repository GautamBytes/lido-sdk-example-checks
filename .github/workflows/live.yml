name: Hoodi live reads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check:live
      - name: Publish live summary
        if: always()
        run: |
          if [ -f reports/hoodi-live.md ]; then
            cat reports/hoodi-live.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoodi-live-read-report
          path: reports/hoodi-live.*
          if-no-files-found: error
